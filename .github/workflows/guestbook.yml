name: Update guestbook

permissions:
  contents: write
  issues: write

on:
  issues:
    types:
      - opened

jobs:
  append:
    name: Append guestbook entry
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'guestbook') || startsWith(github.event.issue.title, 'Guestbook:')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append entry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || '';
            const getField = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`### ${escaped}\\s+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim().replace(/\r?\n/g, ' ') : '';
            };

            const clean = (value) => value
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .slice(0, 220);
            const cleanUrl = (value) => {
              const trimmed = value.trim();
              if (!/^https:\/\/[^\s<>"']+$/i.test(trimmed)) {
                return '';
              }

              return trimmed
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .slice(0, 500);
            };

            const name = clean(getField('Name') || context.payload.issue.user.login);
            const message = clean(getField('Message') || 'Signed without incident.');
            const title = clean(getField('Yearbook Title') || 'Untitled hallway incident.');
            const imageUrl = cleanUrl(getField('Image URL'));
            const date = new Date().toISOString().slice(0, 10);
            const row = `  <tr><td>${date}</td><td>${name}</td><td>${title}</td><td>${message}</td></tr>`;
            const card = imageUrl ? `    <td width="170" align="center">
              <img src="${imageUrl}" width="150" alt="${title}"><br>
              <b>${title}</b><br>
              <sub>${name}</sub>
            </td>` : '';

            const buildPage = (rows, page, open) => `<details${open ? ' open' : ''}>
            <summary><b>Guestbook Page ${page}: ${page === 1 ? 'freshly signed municipal nonsense' : 'archived desk tapping'}</b></summary>

            <table border="0" cellpadding="6" cellspacing="0">
              <tr>
                <th width="110">Date</th>
                <th width="180">Name</th>
                <th width="170">Title</th>
                <th width="310">Message</th>
              </tr>
            ${rows.join('\n')}
            </table>
            </details>`;

            const buildPages = (rows) => {
              const pageSize = 10;
              const pages = [];
              for (let i = 0; i < rows.length; i += pageSize) {
                pages.push(buildPage(rows.slice(i, i + pageSize), pages.length + 1, pages.length === 0));
              }
              if (pages.length < 2) {
                pages.push(`<details>
            <summary><b>Guestbook Page 2: reserved for future desk tapping</b></summary>

            <table border="0" cellpadding="6" cellspacing="0">
              <tr><td width="710">When page 1 becomes too emotionally crowded, the archive department will pretend this was planned.</td></tr>
            </table>
            </details>`);
              }
              return pages.join('\n\n');
            };
            const buildGallery = (cards) => {
              if (cards.length === 0) {
                return `<table border="0" cellpadding="8" cellspacing="0">
              <tr>
                <td width="520" align="center">No hallway photos yet. This is administratively suspicious.</td>
              </tr>
            </table>`;
              }

              const rows = [];
              for (let i = 0; i < Math.min(cards.length, 15); i += 3) {
                rows.push(`  <tr>\n${cards.slice(i, i + 3).join('\n')}\n  </tr>`);
              }

              return `<table border="0" cellpadding="8" cellspacing="0">\n${rows.join('\n')}\n</table>`;
            };

            const path = 'README.md';
            let readme = fs.readFileSync(path, 'utf8');
            const start = '<!-- GUESTBOOK:START -->';
            const end = '<!-- GUESTBOOK:END -->';
            const galleryStart = '<!-- GUESTBOOK_GALLERY:START -->';
            const galleryEnd = '<!-- GUESTBOOK_GALLERY:END -->';
            if (!readme.includes(start) || !readme.includes(end)) {
              core.setFailed('README guestbook marker was not found.');
              return;
            }
            if (!readme.includes(galleryStart) || !readme.includes(galleryEnd)) {
              core.setFailed('README guestbook gallery marker was not found.');
              return;
            }

            const sectionPattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            const section = readme.match(sectionPattern)[0];
            const rows = [row, ...Array.from(section.matchAll(/  <tr><td>.*?<\/td><td>.*?<\/td><td>.*?<\/td><td>.*?<\/td><\/tr>/g), match => match[0])];
            readme = readme.replace(sectionPattern, `${start}\n${buildPages(rows)}\n${end}`);
            if (card) {
              const galleryPattern = new RegExp(`${galleryStart}[\\s\\S]*?${galleryEnd}`);
              const gallerySection = readme.match(galleryPattern)[0];
              const cards = [card, ...Array.from(gallerySection.matchAll(/    <td width="170" align="center">[\s\S]*?    <\/td>/g), match => match[0])];
              readme = readme.replace(galleryPattern, `${galleryStart}\n${buildGallery(cards)}\n${galleryEnd}`);
            }
            fs.writeFileSync(path, readme);

      - name: Commit guestbook update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add guestbook entry
          file_pattern: README.md

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Guestbook entry registered in the extremely official table.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
